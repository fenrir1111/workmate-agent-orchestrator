[project]
name = "workmate-agent-orchestrator"
version = "0.1.0"
description = "轻量企业数字员工编排平台｜可视化流程编排·工具注册·角色白名单·状态机·人工介入·审计·SLA·方案包导出"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FDE阿泽" }]
keywords = ["agent-orchestrator", "digital-employee", "enterprise-ai", "workflow", "b端", "私有化"]
dependencies = [
  "fastapi>=0.110,<0.116",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
# 可选：轻量可视化后台
ui = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
